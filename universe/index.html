<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sumit Tiwari | Developer Universe</title>
    <!-- We will build this CSS file next -->
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts for that authentic coding aesthetic -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Animated Background Elements -->
    <div class="bg-shape shape1"></div>
    <div class="bg-shape shape2"></div>

    <!-- The Glass Terminal -->
    <main class="glass-terminal">
        
        <!-- Mac-style Window Header -->
        <header class="terminal-header">
            <div class="window-controls">
                <span class="control close"></span>
                <span class="control minimize"></span>
                <span class="control maximize"></span>
            </div>
            <div class="window-title">~/sumit</div>
        </header>

        <!-- Where the typing magic will happen -->
        <div class="terminal-body">
            <div id="typing-container"></div>
            <!-- Blinking cursor waiting for the JS engine -->
            <span class="cursor" id="cursor">█</span>
        </div>

    </main>

    <!-- We will build this JS file last to handle the typing sequence -->
    <script src="main.js"></script>
</body>
</html>
