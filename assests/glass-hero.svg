<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" width="100%" height="100%">
  <defs>
    <!-- Dark Background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>

    <!-- Glowing Orbs to simulate depth -->
    <radialGradient id="glow1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="rgba(56, 182, 255, 0.15)" />
      <stop offset="100%" stop-color="rgba(56, 182, 255, 0)" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.15)" />
      <stop offset="100%" stop-color="rgba(168, 85, 247, 0)" />
    </radialGradient>

    <!-- Glass Card Surface -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
  </defs>

  <style>
    .text { font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 15px; fill: #e2e8f0; }
    .prompt { fill: #38bdf8; font-weight: bold; }
    .cmd { fill: #a855f7; font-weight: bold; }
    .highlight { fill: #f8fafc; font-weight: bold; }
    .cursor { fill: #38bdf8; animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg)" />
  <rect width="100%" height="100%" fill="url(#glow1)" />
  <rect width="100%" height="100%" fill="url(#glow2)" />

  <!-- Glassmorphism Terminal Card -->
  <rect x="50" y="40" width="800" height="370" fill="url(#glass)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" rx="16" />

  <!-- macOS Window Controls -->
  <circle cx="85" cy="70" r="6" fill="#ff5f56" />
  <circle cx="110" cy="70" r="6" fill="#ffbd2e" />
  <circle cx="135" cy="70" r="6" fill="#27c93f" />

  <!-- Terminal Header -->
  <text x="450" y="74" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">~/portfolio/sumit-tiwari</text>
  <line x1="50" y1="95" x2="850" y2="95" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

  <!-- Typing Content -->
  <g transform="translate(85, 140)">
    <text class="text" y="0"><tspan class="prompt">~/sumit</tspan> <tspan class="cmd">$</tspan> whoami</text>
    <text class="text highlight" y="25">Sumit Tiwari — Software Engineer</text>
    
    <text class="text" y="70"><tspan class="prompt">~/sumit</tspan> <tspan class="cmd">$</tspan> analyze_stack</text>
    <text class="text" y="95">C++ [DSA]       <tspan class="prompt">████████████████████</tspan> 99%</text>
    <text class="text" y="120">WebDev          <tspan class="prompt">████████████████</tspan>     85%</text>
    <text class="text" y="145">AIML            <tspan class="prompt">████████████</tspan>         75%</text>
    
    <text class="text" y="195"><tspan class="prompt">~/sumit</tspan> <tspan class="cmd">$</tspan> cat vision.txt</text>
    <text class="text" y="220">Crushing complex algorithms and architecting elegant,</text>
    <text class="text" y="245">scalable systems across intelligent models and the web.</text>

    <text class="text" y="295"><tspan class="prompt">~/sumit</tspan> <tspan class="cmd">$</tspan> <tspan class="cursor">█</tspan></text>
  </g>
</svg>
